# AEGIS Obsidian — AEGIS theme pack for the Hermes dashboard.
# Drop into <Hermes home>/dashboard-themes/ and pick it in the theme switcher.
name: aegis-obsidian
label: AEGIS Obsidian
description: Quiet charcoal, sage accents, room to think.
palette:
  background:
    hex: '#131716'
    alpha: 1
  midground:
    hex: '#e8efeb'
    alpha: 1
  foreground:
    hex: '#ffffff'
    alpha: 0
  warmGlow: rgba(145, 186, 165, 0.3)
  noiseOpacity: 0
typography:
  fontSans: '"Segoe UI Variable", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif'
  fontMono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace
  baseSize: 15px
  lineHeight: '1.6'
  letterSpacing: '0'
layout:
  radius: 0.75rem
  density: comfortable
colorOverrides:
  card: '#181e1c'
  cardForeground: '#e8efeb'
  popover: '#181e1c'
  popoverForeground: '#e8efeb'
  primary: '#91baa5'
  primaryForeground: '#131716'
  secondary: '#222b27'
  secondaryForeground: '#e8efeb'
  muted: '#222b27'
  mutedForeground: '#a0aea6'
  accent: '#222b27'
  accentForeground: '#e8efeb'
  destructive: '#f19e98'
  success: '#99cdb2'
  border: '#35443c'
  input: '#35443c'
  ring: '#91baa5'
