# AEGIS Midnight — AEGIS theme pack for the Hermes dashboard.
# Drop into <Hermes home>/dashboard-themes/ and pick it in the theme switcher.
name: aegis-midnight
label: AEGIS Midnight
description: Deep navy with cool blue signals.
palette:
  background:
    hex: '#111827'
    alpha: 1
  midground:
    hex: '#e4ecfa'
    alpha: 1
  foreground:
    hex: '#ffffff'
    alpha: 0
  warmGlow: rgba(148, 183, 238, 0.3)
  noiseOpacity: 0
typography:
  fontSans: '"Segoe UI Variable", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif'
  fontMono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace
  baseSize: 15px
  lineHeight: '1.6'
  letterSpacing: '0'
layout:
  radius: 0.75rem
  density: comfortable
colorOverrides:
  card: '#182237'
  cardForeground: '#e4ecfa'
  popover: '#182237'
  popoverForeground: '#e4ecfa'
  primary: '#94b7ee'
  primaryForeground: '#121b2b'
  secondary: '#202e46'
  secondaryForeground: '#e4ecfa'
  muted: '#202e46'
  mutedForeground: '#a0b0ca'
  accent: '#202e46'
  accentForeground: '#e4ecfa'
  destructive: '#f0a4ac'
  success: '#90c6b2'
  border: '#34435e'
  input: '#34435e'
  ring: '#94b7ee'
